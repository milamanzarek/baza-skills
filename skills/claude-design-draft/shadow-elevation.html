<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="theme-neural">
<div class="row" style="gap:18px;align-items:flex-end">
<div class="stack" style="align-items:center;gap:10px"><div style="width:104px;height:72px;background:var(--bg-raised);border:1px solid var(--border-hairline);border-radius:12px;box-shadow:var(--shadow-sm)"></div><span class="sw-label">shadow-sm</span></div>
<div class="stack" style="align-items:center;gap:10px"><div style="width:104px;height:72px;background:var(--bg-elevated);border:1px solid var(--border-hairline);border-radius:12px;box-shadow:var(--shadow-md)"></div><span class="sw-label">shadow-md</span></div>
<div class="stack" style="align-items:center;gap:10px"><div style="width:104px;height:72px;background:#241543;border:1px solid var(--border-hairline);border-radius:12px;box-shadow:var(--shadow-lg)"></div><span class="sw-label">shadow-lg</span></div>
<div class="stack" style="align-items:center;gap:10px"><div style="width:104px;height:72px;background:var(--bg-raised);border-radius:12px;box-shadow:var(--glow-magenta)"></div><span class="sw-label">glow-magenta</span></div>
<div class="stack" style="align-items:center;gap:10px"><div style="width:104px;height:72px;background:var(--bg-raised);border-radius:12px;box-shadow:var(--glow-spark)"></div><span class="sw-label">glow-spark</span></div>
</div>
<p style="margin:16px 0 0;font-size:12px;color:var(--text-muted)">On dark, elevation reads through a lifting <strong style="color:var(--text-secondary)">lilac rim</strong> + ambient shadow + a lighter surface. Depth without flatness.</p>
</body></html>

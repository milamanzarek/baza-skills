<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kamilla Gafurzianova, OLY · AI Implementation Consultant</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<link rel="stylesheet" href="../_shared.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg-color); }
  @keyframes kg-rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: no-preference) {
    section.kg-anim { animation: kg-rise .5s ease both; }
  }
  @media (max-width: 920px) {
    section > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    .nav-links { display: none !important; }
    h1.display { font-size: 44px !important; }
  }
</style>
<script src="https://unpkg.com/lucide@0.288.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="theme-neural">
<div id="root"></div>

<script type="text/babel" src="PortfolioAtoms.jsx"></script>
<script type="text/babel" src="PortfolioSections.jsx"></script>
<script type="text/babel">
const NAV = [
  { id: 'about', label: 'About' },
  { id: 'framework', label: 'PPPP' },
  { id: 'skills', label: 'Domains' },
  { id: 'experience', label: 'Trajectory' },
  { id: 'work', label: 'Work' },
  { id: 'contact', label: 'Connect' },
];

const App = () => {
  const [active, setActive] = React.useState('about');
  const [theme, setTheme] = React.useState('theme-neural');

  React.useEffect(() => {
    document.body.className = theme;
    lucide.createIcons();
    if (window.NeuralField) window.NeuralField.initAll();
  });

  const onNav = (id) => {
    setActive(id);
    const el = document.getElementById(id);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
  };
  const onTheme = () => setTheme(t => t === 'theme-neural' ? 'theme-document' : 'theme-neural');

  return (
    <React.Fragment>
      <Nav links={NAV} active={active} onNav={onNav} theme={theme} onTheme={onTheme} />
      <main>
        <NeuralHero />
        <About />
        <PPPPFramework />
        <SkillMatrix />
        <ExperienceTimeline />
        <SelectedWork />
        <Contact />
      </main>
      <Footer />
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script src="../../assets/neural-field.js"></script>
</body>
</html>

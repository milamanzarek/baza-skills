<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="theme-neural">
<div class="row" style="gap:16px;align-items:flex-end">
<div class="stack" style="align-items:center;gap:6px"><div style="width:62px;height:62px;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:2px"></div><span class="sw-label">xs · 2px</span></div><div class="stack" style="align-items:center;gap:6px"><div style="width:62px;height:62px;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:4px"></div><span class="sw-label">sm · 4px</span></div><div class="stack" style="align-items:center;gap:6px"><div style="width:62px;height:62px;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:8px"></div><span class="sw-label">md · 8px</span></div><div class="stack" style="align-items:center;gap:6px"><div style="width:62px;height:62px;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:12px"></div><span class="sw-label">lg · 12px</span></div><div class="stack" style="align-items:center;gap:6px"><div style="width:62px;height:62px;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:18px"></div><span class="sw-label">xl · 18px</span></div><div class="stack" style="align-items:center;gap:6px"><div style="width:62px;height:62px;background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:24px"></div><span class="sw-label">2xl · 24px</span></div>
</div>
<p style="margin:14px 0 0;font-size:12px;color:var(--text-danger)">✕ No pill / capsule radius. Banned by brand.</p>
</body></html>

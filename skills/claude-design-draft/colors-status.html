<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@0.288.0/dist/umd/lucide.min.js"></script>
</head>
<body class="theme-neural">
<div class="row" style="gap:12px">
<span class="badge badge--success"><i data-lucide="check-circle-2"></i>Success</span>
<span class="badge badge--warning"><i data-lucide="alert-triangle"></i>Warning</span>
<span class="badge badge--danger"><i data-lucide="alert-octagon"></i>Alert</span>
</div>
<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:16px">
<div class="stack"><div class="swatch" style="background:#b9a6d4"></div><span class="sw-name">Success</span><span class="sw-label">muted lavender + check</span></div>
<div class="stack"><div class="swatch" style="background:#d8a583"></div><span class="sw-name">Warning</span><span class="sw-label">dusty apricot + caution</span></div>
<div class="stack"><div class="swatch" style="background:#c76d86"></div><span class="sw-name">Alert</span><span class="sw-label">dusty rose + alert</span></div>
</div>
<p style="margin:14px 0 0;font-size:12px;color:var(--text-muted)">Status lives entirely in the brand palette. No green, yellow, red or blue. An <strong style="color:var(--text-secondary)">icon</strong> always carries the meaning, so it's colour-blind safe.</p>
<script>lucide.createIcons();</script>
</body></html>

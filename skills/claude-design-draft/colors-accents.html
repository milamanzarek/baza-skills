<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="theme-neural">
<div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div class="stack"><div class="swatch" style="background:#c75c6e"></div><span class="sw-name">Bordeaux</span><span class="sw-label">--accent-primary</span></div>
<div class="stack"><div class="swatch" style="background:#d9b8f5"></div><span class="sw-name">Lilac</span><span class="sw-label">--accent-secondary</span></div>
<div class="stack"><div class="swatch" style="background:#924bb2"></div><span class="sw-name">Violet</span><span class="sw-label">--accent-violet</span></div>
<div class="stack"><div class="swatch" style="background:#f6b187"></div><span class="sw-name">Spark (ignition)</span><span class="sw-label">--spark</span></div>
</div>
<p style="margin:14px 0 0;font-size:12px;color:var(--text-muted)">Bordeaux replaces the hot magenta for a warmer, less aggressive primary. Lilac (Kamilla's flower) brightened; spark is a soft peach. One spark per composition.</p>
</body></html>

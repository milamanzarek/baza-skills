<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@0.288.0/dist/umd/lucide.min.js"></script>
</head>
<body class="theme-neural">
<div class="row" style="gap:10px">
<span class="badge badge--primary">Primary</span>
<span class="badge badge--secondary">Secondary</span>
<span class="badge badge--success"><i data-lucide="check-circle-2"></i>Verified</span>
<span class="badge badge--warning"><i data-lucide="clock"></i>Pending</span>
<span class="badge badge--danger"><i data-lucide="alert-octagon"></i>Blocked</span>
</div>
<p style="margin:14px 0 0;font-size:12px;color:var(--text-muted)">Status badges pair a brand hue with an icon.</p>
<script>lucide.createIcons();</script>
</body></html>

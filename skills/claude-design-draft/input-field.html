<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="theme-neural">
<div class="col" style="gap:14px;max-width:360px">
<div class="stack" style="gap:6px"><span class="label">Your name</span><input class="field" placeholder="e.g. Kamilla Gafurzianova"></div>
<div class="stack" style="gap:6px"><span class="label">Message</span><textarea class="field" rows="2" placeholder="What should we connect?"></textarea></div>
<div class="stack" style="gap:6px"><span class="label">Focused state</span><input class="field" value="kamilla@example.com" style="border-color:var(--accent-secondary);box-shadow:inset 0 1px 3px rgba(0,0,0,0.4), 0 0 0 3px rgba(217,184,245,0.30)"></div>
</div>
<p style="margin:14px 0 0;font-size:12px;color:var(--text-muted)">Fields sit on a lighter elevated surface with a clearly visible lilac border (3:1+) and an AA placeholder. Focus adds a bright ring.</p>
</body></html>

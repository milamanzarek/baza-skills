<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body class="theme-neural">
<div class="row" style="gap:18px">
<div class="stack" style="align-items:center;gap:8px"><span class="node node--lg" style="background:var(--p-past);box-shadow:0 0 18px var(--p-past)"></span><span class="sw-label">Past</span></div>
<div class="stack" style="align-items:center;gap:8px"><span class="node node--lg" style="background:var(--p-present);box-shadow:0 0 18px var(--p-present)"></span><span class="sw-label">Present</span></div>
<div class="stack" style="align-items:center;gap:8px"><span class="node node--lg" style="background:var(--p-possible);box-shadow:0 0 18px var(--p-possible)"></span><span class="sw-label">Possible</span></div>
<div class="stack" style="align-items:center;gap:8px"><span class="node node--lg" style="background:var(--p-practice);box-shadow:0 0 18px var(--p-practice)"></span><span class="sw-label">Practice</span></div>
<div class="stack" style="align-items:center;gap:8px"><span class="node node--lg" style="background:var(--p-protocol);box-shadow:0 0 18px var(--p-protocol)"></span><span class="sw-label">Protocol</span></div>
</div>
<p style="margin:16px 0 0;font-size:12px;color:var(--text-muted)">A single purple gradient, darkest (Past) to lilac (Protocol, the connective thread the others string onto).</p>
</body></html>
